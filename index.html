<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menuse</title>
<meta name="description" content="Qué comer cada día y la compra de la semana">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menuse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#EDEDE5;
  --card:#FBFAF5;
  --card-2:#F4F3EA;
  --ink:#1B2420;
  --ink-soft:#586159;
  --ink-faint:#6F786D;
  --brand:#1F4D3D;
  --brand-on:#F2F7F2;
  --brand-tint:#DFE8DF;
  --accent:#B8501F;
  --accent-tint:#F5E3D8;
  --accent-ink:#7A3614;
  --wheat:#6E540C;
  --wheat-tint:#EFE6C9;
  --line:#DEDDD1;
  --line-strong:#C7C6B6;
  --danger:#A33A26;
  --shadow:0 1px 2px rgba(27,36,32,.06), 0 6px 18px -12px rgba(27,36,32,.28);
  --r:14px;
  --r-sm:9px;
  --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Petrona', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#121611; --card:#1B211B; --card-2:#232A23;
    --ink:#E9EDE4; --ink-soft:#A6AFA3; --ink-faint:#858E82;
    --brand:#82BC9E; --brand-on:#0C1A13; --brand-tint:#1E2E25;
    --accent:#E08A5B; --accent-tint:#33231A; --accent-ink:#F0BC98;
    --wheat:#D6B74E; --wheat-tint:#332C16;
    --line:#2B322A; --line-strong:#3C443A; --danger:#E07A62;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#121611; --card:#1B211B; --card-2:#232A23;
  --ink:#E9EDE4; --ink-soft:#A6AFA3; --ink-faint:#858E82;
  --brand:#82BC9E; --brand-on:#0C1A13; --brand-tint:#1E2E25;
  --accent:#E08A5B; --accent-tint:#33231A; --accent-ink:#F0BC98;
  --wheat:#D6B74E; --wheat-tint:#332C16;
  --line:#2B322A; --line-strong:#3C443A; --danger:#E07A62;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom, 0px));
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.shell{max-width:520px;margin:0 auto;padding:0 16px;}

/* top bar */
.topbar{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:520px;margin:0 auto;padding:12px 16px 10px;}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.mark{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:block;}
.wordmark{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1;margin:0;}
.tagline{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;margin:3px 0 0;}
.brandtext{flex:1;min-width:0;}
.hbtn{
  flex:0 0 auto;width:34px;height:34px;
  border:1px solid var(--line);background:var(--card);
  border-radius:9px;color:var(--ink-soft);
  display:grid;place-items:center;padding:0;
}
.hbtn svg{width:16px;height:16px;}
.weeks{display:flex;align-items:center;gap:10px;}
.weeks-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;flex:0 0 auto;}
.seg{display:flex;flex:1;gap:3px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:3px;}
.seg button{
  flex:1;border:0;background:transparent;color:var(--ink-soft);
  font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;
  padding:6px 0;border-radius:8px;transition:background .16s ease,color .16s ease;
}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-on);}

.view{padding-top:16px;}
.view[hidden]{display:none!important;}

/* --- banda de aviso --- */
.banner{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--accent-tint);
  border:1px solid color-mix(in srgb, var(--accent) 30%, var(--accent-tint));
  border-radius:12px;padding:11px 13px;margin-bottom:12px;
}
.banner svg{width:17px;height:17px;color:var(--accent);flex:0 0 auto;margin-top:1px;}
.banner-k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.banner-v{font-size:13.5px;color:var(--accent-ink);margin-top:3px;}
.banner-v em{font-style:normal;font-weight:600;}

.offline{
  display:flex;gap:9px;align-items:center;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;margin-bottom:12px;
  font-size:12.5px;color:var(--ink-soft);
}
.offline svg{width:16px;height:16px;flex:0 0 auto;}

/* --- Hoy --- */
.mealcard{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.mealcard > .meal-name{margin-bottom:10px;display:block;}
.meal-name{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);}
.mealcard.wknd .meal-name{color:var(--accent);}
.dishes{display:flex;flex-direction:column;gap:14px;}

.dish-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.dish-name{flex:1;font-weight:600;font-size:15px;margin:0;letter-spacing:-.005em;}
.icon-btn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card-2);
  color:var(--ink-soft);border-radius:7px;padding:4px 8px;
  font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;
}
.icon-btn svg{width:12px;height:12px;}
.icon-btn:active{background:var(--line);}
.prep{
  display:flex;gap:7px;align-items:flex-start;
  margin-top:7px;font-size:12.5px;color:var(--ink-soft);
}
.prep svg{width:13px;height:13px;color:var(--accent);flex:0 0 auto;margin-top:2px;}

.ings{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
.ing{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13.5px;}
.ing .q{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.ing .n{color:var(--ink-soft);min-width:0;}
.ing .h{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.opt-mark{color:var(--ink-faint);font-size:11px;font-style:italic;margin-left:5px;}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--wheat);margin-left:5px;vertical-align:middle;}

/* --- Semana --- */
.searchbar{
  width:100%;display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);background:var(--card);
  border-radius:11px;padding:11px 12px;margin-bottom:12px;
  color:var(--ink-faint);font-size:14px;text-align:left;
  box-shadow:var(--shadow);
}
.searchbar svg{width:17px;height:17px;flex:0 0 auto;}

.day{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow);
}
.day-head{
  width:100%;display:flex;align-items:flex-start;gap:11px;
  padding:12px 13px;background:transparent;border:0;text-align:left;
}
.chip{
  flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--brand-tint);color:var(--brand);
  font-family:var(--serif);font-weight:700;font-size:13.5px;line-height:1;margin-top:1px;
}
.day.wknd .chip{background:var(--accent-tint);color:var(--accent);}
.day-meta{flex:1;min-width:0;display:block;}
.day-name{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.15;display:flex;align-items:center;gap:7px;}
.today-tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:var(--accent-tint);
  padding:2px 6px;border-radius:5px;
}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 7px;margin-top:4px;}
.sum-k{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding-top:2px;}
.sum-v{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.chev{flex:0 0 auto;width:18px;height:18px;color:var(--ink-faint);transition:transform .26s cubic-bezier(.4,0,.2,1);margin-top:5px;}
.day.open .chev{transform:rotate(180deg);}
.day-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1);}
.day.open .day-body{grid-template-rows:1fr;}
.day-body-in{overflow:hidden;min-height:0;}
.day-body-pad{padding:2px 13px 13px;}
.meal{border-top:1px solid var(--line);padding-top:11px;margin-top:11px;}
.meal:first-child{border-top:0;margin-top:2px;padding-top:2px;}
.meal-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.meal-rule{flex:1;height:1px;background:var(--line);}
.day.wknd .meal-name{color:var(--accent);}
.dish{margin-bottom:11px;}
.dish:last-of-type{margin-bottom:0;}
.add-dish{
  width:100%;margin-top:10px;padding:8px;
  border:1px dashed var(--line-strong);border-radius:var(--r-sm);
  background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:600;
}
.add-dish:active{background:var(--card-2);}

/* --- Compra --- */
.progress-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.progress-num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.progress-num span{font-size:14px;color:var(--ink-faint);font-weight:500;}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:12.5px;font-weight:600;padding:2px;}
.bar{height:5px;background:var(--card-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s ease;}
.switchrow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-soft);
}
.switch{
  flex:0 0 auto;width:40px;height:23px;border-radius:99px;
  border:1px solid var(--line-strong);background:var(--card-2);
  padding:2px;display:flex;align-items:center;
  transition:background .18s ease,border-color .18s ease;
}
.switch i{display:block;width:17px;height:17px;border-radius:50%;background:var(--ink-faint);transition:transform .18s ease,background .18s ease;}
.switch[aria-checked="true"]{background:var(--brand);border-color:var(--brand);}
.switch[aria-checked="true"] i{transform:translateX(17px);background:var(--brand-on);}
.toolrow{display:flex;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.tool{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);
  border-radius:var(--r-sm);padding:8px;font-size:12.5px;font-weight:600;
}
.tool svg{width:14px;height:14px;}

.sec{margin-bottom:16px;}
.sec.optionals{opacity:.82;}
.sec-head{display:flex;align-items:baseline;gap:8px;padding:0 2px 7px;}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);}
.sec-count{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.sec-rule{flex:1;height:1px;background:var(--line);}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);}
.row:first-child{border-top:0;}
.tick{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;
  border:1.5px solid var(--line-strong);background:transparent;
  display:grid;place-items:center;padding:0;
  transition:background .14s ease,border-color .14s ease;
}
.tick svg{width:13px;height:13px;color:var(--brand-on);opacity:0;}
.tick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);}
.tick[aria-pressed="true"] svg{opacity:1;}
.row-main{
  flex:1;min-width:0;display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(70px,auto) 14px;
  gap:8px;align-items:center;background:transparent;border:0;padding:0;text-align:left;
}
.row-text{min-width:0;}
.row-name{display:block;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-hint{display:block;font-size:11.5px;line-height:1.3;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.row.done .row-name{color:var(--ink-faint);text-decoration:line-through;}
.row-tags{display:flex;gap:4px;}
.row-qty{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;}
.row.done .row-qty{color:var(--ink-faint);}
.row-chev{width:14px;height:14px;color:var(--ink-faint);}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:5px;white-space:nowrap;}
.tag.basic{color:var(--wheat);background:var(--wheat-tint);}
.tag.mine{color:var(--accent);background:var(--accent-tint);}
.tag.opt{color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line);}

.addbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow);}
.addbox h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);}
.field{
  width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card-2);color:var(--ink);font-size:14px;
}
.field::placeholder{color:var(--ink-faint);}
textarea.field{min-height:110px;resize:vertical;font-size:12px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;}
.addrow{display:flex;gap:8px;margin-top:8px;}
.addrow .field{flex:1;min-width:0;}
.btn{border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:600;font-size:14px;background:var(--brand);color:var(--brand-on);}
.btn.ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line);}
.btn:active{transform:scale(.985);}
.btn.full{width:100%;}
.textdanger{display:block;width:100%;text-align:center;border:0;background:transparent;color:var(--danger);font-size:13px;font-weight:600;padding:10px;}
.empty{text-align:center;padding:34px 20px;color:var(--ink-faint);font-size:13.5px;}

/* tabs */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom, 0px);
}
.tabbar-in{max-width:520px;margin:0 auto;display:flex;padding:7px 16px 8px;gap:8px;}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:0;background:transparent;color:var(--ink-faint);
  font-size:11px;font-weight:600;padding:5px 0;border-radius:10px;
}
.tab svg{width:21px;height:21px;}
.tab[aria-selected="true"]{color:var(--brand);}

/* deshacer */
.snack{
  position:fixed;left:16px;right:16px;
  bottom:calc(78px + env(safe-area-inset-bottom, 0px));z-index:30;
  max-width:488px;margin:0 auto;
  background:var(--ink);color:var(--paper);
  border-radius:var(--r-sm);padding:11px 13px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.45);font-size:13.5px;
  opacity:0;transform:translateY(8px);
  transition:opacity .2s ease,transform .2s ease;
}
.snack.on{opacity:1;transform:translateY(0);}
.snack span{flex:1;min-width:0;}
.snack button{flex:0 0 auto;border:0;background:transparent;color:inherit;font-weight:700;font-size:13.5px;padding:2px 4px;text-decoration:underline;}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(12,16,13,.45);opacity:0;transition:opacity .22s ease;}
.scrim.on{opacity:1;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding:0 0 calc(18px + env(safe-area-inset-bottom, 0px));
}
.sheet.on{transform:translateY(0);}
.sheet-in{max-width:520px;margin:0 auto;padding:0 16px;}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto 4px;}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:6px 0 14px;}
.sheet-title{flex:1;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.2;margin:0;text-wrap:balance;}
.sheet-sub{font-size:12.5px;color:var(--ink-faint);margin:3px 0 0;}
.close{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--card-2);
  color:var(--ink-soft);display:grid;place-items:center;padding:0;
}
.close svg{width:14px;height:14px;}
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--card-2);padding:12px;margin-bottom:12px;}
.block-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 9px;}
.origin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;}
.origin:first-of-type{border-top:0;padding-top:0;}
.origin .od{font-family:var(--serif);font-weight:600;color:var(--brand);font-size:13px;white-space:nowrap;}
.origin .op{color:var(--ink);min-width:0;}
.origin .op b{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.origin .oq{color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.qtyrow{display:flex;gap:8px;align-items:center;}
.qtyrow .field{flex:1;}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.ed-ing{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:10px;margin-bottom:8px;}
.ed-top{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
.ed-top .field{flex:1;min-width:0;}
.ed-bot{display:flex;gap:8px;}
.ed-bot .field{flex:1;min-width:0;padding:7px 9px;font-size:13px;}
.del-x{flex:0 0 auto;width:30px;height:30px;border:0;background:transparent;color:var(--ink-faint);display:grid;place-items:center;border-radius:7px;padding:0;}
.del-x svg{width:15px;height:15px;}
.del-x:active{background:var(--accent-tint);color:var(--danger);}
.hintline{font-size:12px;color:var(--ink-faint);margin:8px 0 0;line-height:1.4;}

/* resultados de búsqueda */
.hit{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:12px;border:0;border-top:1px solid var(--line);
  background:transparent;text-align:left;
}
.hit:first-child{border-top:0;}
.hit-meta{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.hit-name{display:block;font-size:14.5px;font-weight:600;margin-top:3px;}
.hit svg{width:14px;height:14px;color:var(--ink-faint);flex:0 0 auto;}

/* pasillos */
.aisle{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:var(--r-sm);margin-bottom:7px;
}
.aisle-name{flex:1;min-width:0;font-size:14px;font-weight:500;}
.aisle-btns{display:flex;gap:5px;flex:0 0 auto;}
.abtn{
  width:32px;height:32px;border:1px solid var(--line);
  background:var(--card-2);color:var(--ink-soft);
  border-radius:8px;display:grid;place-items:center;padding:0;
}
.abtn svg{width:14px;height:14px;}
.abtn[disabled]{opacity:.35;cursor:default;}
.aisle-n{font-size:11px;color:var(--ink-faint);width:14px;text-align:right;font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;}
}

  {id:"otros",    label:"Otros"}
];
const RULES=[
  [/(caldo|tomate frito|salsa|aceite|vinagre|mayonesa|alioli|ketchup|mostaza|harina|pan rallado|pimenton|\bsal\b|pimienta|nuez moscada|vino|soja|patatas fritas|nachos|guacamole|jalapeno|pepinillo|guindilla|aceituna|croqueta|empanadilla|gnocchi)/,"despensa"],
  [/(obleas|masa de pizza|brioche|pan de molde|\bpan\b|panes)/,"panaderia"],
  [/(huevo|nata|leche|queso|mozzarella|parmesano|cheddar|mantequilla)/,"lacteos"],
  [/(pescad|merluza|rape|dorada|boquer|sardina|almeja|gula|palometa|lubina|bacalao|calamar|gallo|atun|marisco)/,"pescado"],
  [/(pollo|pavo|ternera|cerdo|jamon|bacon|panceta|morcilla|lomo|carne|alita|secreto|salchicha|chorizo|costilla|chuleta|pechuga|nugget|hamburguesa|york|raxo)/,"carne"],
  [/(verdura|patata|zanahoria|puerro|calabac|\bajo\b|cebolla|tomate|lechuga|seta|calabaza|limon|pimiento|maiz|espinaca|brocoli|berenjena|guisante|jengibre|perejil|romero|shiitake)/,"verdura"],
  [/(arroz|pasta|quinoa|fideo|noodle|lenteja|garbanzo|legumbre)/,"despensa"]
];
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function sectionFor(item){
  const s=norm(item);
  for(const [re,id] of RULES){ if(re.test(s)) return id; }
  return "otros";
}
function parseItem(raw){
  const txt=String(raw||"").trim();
  const m=txt.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  if(!m || !m[1]) return {short:txt, hint:null, optional:false};
  const inner=m[2].trim();
  const optional=/^opcional$/i.test(inner) || /^si\b/i.test(inner);
  return {short:m[1].trim(), hint:optional?null:inner, optional:optional};
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function migrate(menu){
  return menu.map(week=>week.map((day,di)=>{
    if(day && Array.isArray(day.meals)) return day;
    const ds=(day && day.dishes) || [];
    if(di>=5 || ds.length<2) return {meals:[{id:"libre",name:"Libre",dishes:ds}]};
    return {meals:[
      {id:"comida",name:"Comida",dishes:ds.slice(0,-1)},
      {id:"cena",  name:"Cena",  dishes:ds.slice(-1)}
    ]};
  }));
}

  MENU = migrate(raw ? JSON.parse(raw) : clone(DEFAULT_MENU));
}catch(e){ MENU = migrate(clone(DEFAULT_MENU)); }
if(!Array.isArray(MENU) || MENU.length!==4) MENU = migrate(clone(DEFAULT_MENU));
function saveMenu(){ lsSet(K_MENU, JSON.stringify(MENU)); }

function loadBasics(){ try{ return JSON.parse(lsGet(K_BASICS)) || {}; }catch(e){ return {}; } }
function saveBasics(o){ lsSet(K_BASICS, JSON.stringify(o)); }

function aisleOrder(){
  let ids=null;
  try{ ids=JSON.parse(lsGet(K_AISLES)); }catch(e){}
  const valid=SECTIONS.map(s=>s.id);
  if(!Array.isArray(ids)) ids=[];
  ids=ids.filter(i=>valid.indexOf(i)>=0);
  valid.forEach(i=>{ if(ids.indexOf(i)<0) ids.push(i); });
  return ids;
}
function saveAisles(ids){ lsSet(K_AISLES, JSON.stringify(ids)); }
function sectionLabel(id){ const s=SECTIONS.find(x=>x.id===id); return s?s.label:"Otros"; }

function weekState(w){
  try{ const r=lsGet(K_WEEK+w); if(r) return JSON.parse(r); }catch(e){}
  return {checked:{},overrides:{},removed:[],custom:[]};
}
function saveWeekState(w,s){ lsSet(K_WEEK+w, JSON.stringify(s)); }

let week=0;

openDays.add(todayIdx);

function eachDish(fn){
  MENU.forEach((wk,wi)=>wk.forEach((day,di)=>day.meals.forEach((meal,mi)=>
    meal.dishes.forEach((dish,si)=>fn(dish,{wi,di,mi,si,meal})))));
}
function weekCountFor(shortLower){
  const seen=new Set();
  eachDish((dish,ctx)=>{
    dish.ingredients.forEach(i=>{
      if(norm(parseItem(i.item).short)===shortLower) seen.add(ctx.wi);
    });
  });
  return seen.size;
}
function isBasic(shortName){
  const k=norm(shortName);
  const ov=loadBasics();
  if(Object.prototype.hasOwnProperty.call(ov,k)) return !!ov[k];
  return weekCountFor(k)>=3;
}
function toggleBasic(shortName){
  const k=norm(shortName);
  const ov=loadBasics();
  ov[k]=!isBasic(shortName);
  saveBasics(ov);
}

function buildList(w){
  const map=new Map();
  MENU[w].forEach((day,dayIdx)=>{
    day.meals.forEach(meal=>{
      meal.dishes.forEach(dish=>{
        dish.ingredients.forEach(i=>{
          const p=parseItem(i.item);
          if(!p.short) return;
          const k=norm(p.short);
          let e=map.get(k);
          if(!e){
            e={key:k,qty:null,unit:null,item:p.short,hint:p.hint,custom:false,allOptional:true,origins:[]};
            map.set(k,e);
          }
          if(!e.hint && p.hint) e.hint=p.hint;
          if(!p.optional) e.allOptional=false;
          if(e.unit==null && i.unit) e.unit=i.unit;
          if(i.qty!=null && (i.unit||null)===(e.unit||null)) e.qty=(e.qty||0)+i.qty;
          e.origins.push({day:dayIdx,meal:meal.name,dish:dish.name,qty:i.qty,unit:i.unit});
        });
      });
    });
  });
  return [...map.values()];
}
function shopItems(w){
  const st=weekState(w);
  const base=buildList(w).filter(i=>!st.removed.includes(i.key));
  base.forEach(i=>{ if(Object.prototype.hasOwnProperty.call(st.overrides,i.key)) i.qty=st.overrides[i.key]; });
  const custom=(st.custom||[]).map(c=>({...c,custom:true,allOptional:false,hint:null,origins:[]}));
  return {st:st, all:base.concat(custom)};
}

function fmt(n){ return Math.round(n*100)/100; }
function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
function unitText(q,u){
  if(!u) return "";
  if(u==="diente" && q!=null && q!==1) return "dientes";
  return u;
}
function qtyText(q,u){ return q==null ? "" : fmt(q)+(u?" "+unitText(q,u):""); }

function svg(paths,sw){
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none");
  s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width",sw||"1.8");
  s.setAttribute("stroke-linecap","round");
  s.setAttribute("stroke-linejoin","round");
  s.setAttribute("aria-hidden","true");
  s.innerHTML=paths;
  return s;
}

const snack=document.getElementById("snack");

const snackUndo=document.getElementById("snackUndo");
let undoFn=null, snackTimer=null, hideTimer=null;
function showUndo(msg,fn){
  clearTimeout(snackTimer); clearTimeout(hideTimer);
  undoFn=fn; snackMsg.textContent=msg;
  snack.hidden=false;
  requestAnimationFrame(()=>snack.classList.add("on"));

/* ---------- piezas ---------- */
function ingList(dish){
  const ul=document.createElement("ul");
  ul.className="ings";
  dish.ingredients.forEach(i=>{
    const p=parseItem(i.item);
    const li=document.createElement("li");
    li.className="ing";
    const q=document.createElement("span");
    q.className="q"; q.textContent=qtyText(i.qty,i.unit);
    const n=document.createElement("span");
    n.className="n";
    n.appendChild(document.createTextNode(cap(p.short)));
    if(p.optional){
      const o=document.createElement("span");
      o.className="opt-mark"; o.textContent="opcional";
      n.appendChild(o);
    }
    if(isBasic(p.short)){
      const dot=document.createElement("span");
      dot.className="dot"; dot.setAttribute("title","Básico de despensa");
      n.appendChild(dot);
    }
    if(p.hint){
      const h=document.createElement("span");
      h.className="h"; h.textContent=p.hint;
      n.appendChild(h);
    }
    li.append(q,n);
    ul.appendChild(li);
  });
  return ul;
}
function prepLine(dish){
  if(!dish.prep || !String(dish.prep).trim()) return null;
  const d=document.createElement("div");
  d.className="prep";
  d.appendChild(svg(P_BELL,"1.8"));
  const t=document.createElement("span");
  t.textContent=dish.prep;
  d.appendChild(t);
  return d;
}
function dishBlock(dish,dayIdx,mealIdx,dishIdx,withEdit){
  const d=document.createElement("div");
  d.className="dish";
  const dh=document.createElement("div");
  dh.className="dish-head";
  const h3=document.createElement("h3");
  h3.className="dish-name"; h3.textContent=dish.name;
  dh.appendChild(h3);
  if(withEdit){
    const eb=document.createElement("button");
    eb.className="icon-btn";
    eb.appendChild(svg(P_PENCIL,"2"));
    eb.appendChild(document.createTextNode("Editar"));
    eb.addEventListener("click",()=>openDishSheet(dayIdx,mealIdx,dishIdx));
    dh.appendChild(eb);
  }
  d.appendChild(dh);
  d.appendChild(ingList(dish));
  const pl=prepLine(dish);
  if(pl) d.appendChild(pl);
  return d;
}

    });

    const chev=document.createElement("span");
    chev.className="chev";

    head.append(chip,meta,chev);

      if(openDays.has(dayIdx)) openDays.delete(dayIdx); else openDays.add(dayIdx);

        openDishSheet(dayIdx,mealIdx,meal.dishes.length-1);

      pad.appendChild(sec);
    });

    bin.appendChild(pad);
    body.appendChild(bin);
    art.append(head,body);
    host.appendChild(art);
  });
}

/* ---------- vista: Compra ---------- */
function renderShop(){
  const host=document.getElementById("viewShop");
  host.textContent="";
  const {st,all}=shopItems(week);

  if(!navigator.onLine){
    const off=document.createElement("div");
    off.className="offline";
    off.appendChild(svg(P_OFF,"1.7"));
    const t=document.createElement("span");
    t.textContent="Sin conexión — la lista sigue aquí";
    off.appendChild(t);
    host.appendChild(off);
  }

  const hide = lsGet(K_HIDE)==="1";
  const shown = hide ? all.filter(i=>!isBasic(i.item)) : all;
  const main = shown.filter(i=>!i.allOptional);
  const opt  = shown.filter(i=>i.allOptional);
  const done=main.filter(i=>st.checked[i.key]).length;
  const pct = main.length ? Math.round(done/main.length*100) : 0;

  const card=document.createElement("div");
  card.className="progress-card";
  const top=document.createElement("div");
  top.className="progress-top";
  const num=document.createElement("div");
  num.className="progress-num";
  num.append(String(done));
  const sp=document.createElement("span");
  sp.textContent=" de "+main.length+" comprados";
  num.appendChild(sp);
  const closeBtn=document.createElement("button");
  closeBtn.className="linkbtn"; closeBtn.textContent="Compra hecha";
  closeBtn.addEventListener("click",()=>openCloseSheet(main,done));
  top.append(num,closeBtn);

  const bar=document.createElement("div");
  bar.className="bar";
  const fill=document.createElement("i");
  fill.style.width=pct+"%";
  bar.appendChild(fill);

  const srow=document.createElement("div");
  srow.className="switchrow";
  const slab=document.createElement("span");
  slab.textContent="Ocultar básicos de despensa";
  const sw=document.createElement("button");
  sw.className="switch"; sw.setAttribute("role","switch");
  sw.setAttribute("aria-checked", hide?"true":"false");
  sw.setAttribute("aria-label","Ocultar básicos de despensa");
  sw.innerHTML="<i></i>";
  sw.addEventListener("click",()=>{ lsSet(K_HIDE, hide?"0":"1"); renderShop(); });
  srow.append(slab,sw);

  const tools=document.createElement("div");
  tools.className="toolrow";
  const shareB=document.createElement("button");
  shareB.className="tool";
  shareB.appendChild(svg(P_SHARE,"1.8"));
  shareB.appendChild(document.createTextNode("Compartir"));
  shareB.addEventListener("click",()=>openShareSheet());
  const sortB=document.createElement("button");
  sortB.className="tool";
  sortB.appendChild(svg(P_SORT,"1.8"));
  sortB.appendChild(document.createTextNode("Pasillos"));
  sortB.addEventListener("click",openAisleSheet);
  tools.append(shareB,sortB);

  card.append(top,bar,srow,tools);
  host.appendChild(card);

  if(!shown.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent = hide ? "Todo lo de esta semana son básicos que ya tienes." : "No hay nada en la lista de esta semana.";
    host.appendChild(e);
  }

  function rowFor(i){
    const checked=!!st.checked[i.key];
    const row=document.createElement("div");
    row.className="row"+(checked?" done":"");
    const tick=document.createElement("button");
    tick.className="tick";
    tick.setAttribute("aria-pressed",checked?"true":"false");
    tick.setAttribute("aria-label",(checked?"Desmarcar ":"Marcar ")+i.item);
    tick.appendChild(svg(P_CHECK,"3"));
    tick.addEventListener("click",()=>{
      const s=weekState(week);
      s.checked[i.key]=!s.checked[i.key];
      saveWeekState(week,s); renderShop();
    });
    const main2=document.createElement("button");
    main2.className="row-main";
    main2.setAttribute("aria-label","Ver de qué comidas viene "+i.item);
    const txt=document.createElement("span");
    txt.className="row-text";
    const nm=document.createElement("span");
    nm.className="row-name"; nm.textContent=cap(i.item);
    txt.appendChild(nm);
    if(i.hint){
      const h=document.createElement("span");
      h.className="row-hint"; h.textContent=i.hint;
      txt.appendChild(h);
    }
    const tags=document.createElement("span");
    tags.className="row-tags";
    if(i.custom){
      const t=document.createElement("span"); t.className="tag mine"; t.textContent="tuyo"; tags.appendChild(t);
    }else if(i.allOptional){
      const t=document.createElement("span"); t.className="tag opt"; t.textContent="opcional"; tags.appendChild(t);
    }else if(isBasic(i.item)){
      const t=document.createElement("span"); t.className="tag basic"; t.textContent="básico"; tags.appendChild(t);
    }
    const q=document.createElement("span");
    q.className="row-qty"; q.textContent=qtyText(i.qty,i.unit);
    const ch=document.createElement("span");
    ch.className="row-chev";
    ch.appendChild(svg(P_RIGHT,"2.2"));
    main2.append(txt,tags,q,ch);
    main2.addEventListener("click",()=>openIngredientSheet(i));
    row.append(tick,main2);
    return row;
  }

  aisleOrder().forEach(secId=>{
    const items=main.filter(i=>sectionFor(i.item)===secId);
    if(!items.length) return;
    const wrap=document.createElement("section");
    wrap.className="sec";
    const sh=document.createElement("div");
    sh.className="sec-head";
    const t1=document.createElement("span");
    t1.className="sec-title"; t1.textContent=sectionLabel(secId);
    const rule=document.createElement("span"); rule.className="sec-rule";
    const cnt=document.createElement("span");
    cnt.className="sec-count";
    cnt.textContent=items.filter(i=>st.checked[i.key]).length+"/"+items.length;
    sh.append(t1,rule,cnt);
    const rows=document.createElement("div");
    rows.className="rows";
    items.forEach(i=>rows.appendChild(rowFor(i)));
    wrap.append(sh,rows);
    host.appendChild(wrap);
  });

  if(opt.length){
    const wrap=document.createElement("section");
    wrap.className="sec optionals";
    const sh=document.createElement("div");
    sh.className="sec-head";
    const t1=document.createElement("span");
    t1.className="sec-title"; t1.textContent="Opcionales";
    const rule=document.createElement("span"); rule.className="sec-rule";
    const cnt=document.createElement("span");
    cnt.className="sec-count"; cnt.textContent="fuera del total";
    sh.append(t1,rule,cnt);
    const rows=document.createElement("div");
    rows.className="rows";
    opt.forEach(i=>rows.appendChild(rowFor(i)));
    wrap.append(sh,rows);
    host.appendChild(wrap);
  }

  const box=document.createElement("div");
  box.className="addbox";
  const h3=document.createElement("h3");
  h3.textContent="Añadir a la lista";
  const nEl=document.createElement("input");
  nEl.className="field"; nEl.type="text";
  nEl.placeholder="Por ejemplo: papel de cocina";
  const ar=document.createElement("div");
  ar.className="addrow";
  const qEl=document.createElement("input");
  qEl.className="field"; qEl.type="number";
  qEl.min="0"; qEl.step="any"; qEl.inputMode="decimal"; qEl.placeholder="Cant.";
  const uEl=document.createElement("input");
  uEl.className="field"; uEl.type="text"; uEl.placeholder="g, ml, ud";
  const bEl=document.createElement("button");
  bEl.className="btn"; bEl.textContent="Añadir";
  ar.append(qEl,uEl,bEl);
  box.append(h3,nEl,ar);
  host.appendChild(box);

  bEl.addEventListener("click",()=>{
    const name=nEl.value.trim();
    if(!name){ nEl.focus(); return; }
    const s=weekState(week);
    s.custom=s.custom||[];
    s.custom.push({
      key:"custom::"+Date.now()+"::"+norm(name),
      item:name,
      qty:qEl.value.trim()?parseFloat(qEl.value):null,
      unit:uEl.value.trim()||null
    });
    saveWeekState(week,s); renderShop();
    showUndo(cap(name)+" añadido a la lista", ()=>{
      const s2=weekState(week);
      s2.custom=(s2.custom||[]).slice(0,-1);
      saveWeekState(week,s2); renderShop();
    });
  });
}

const scrim=document.getElementById("scrim");
const sheet=document.getElementById("sheet");
const sheetIn=document.getElementById("sheetIn");
let lastFocus=null;
function openSheet(build){
  lastFocus=document.activeElement;
  sheetIn.textContent="";

  scrim.hidden=false; sheet.hidden=false;
  requestAnimationFrame(()=>{ scrim.classList.add("on"); sheet.classList.add("on"); });

  scrim.classList.remove("on"); sheet.classList.remove("on");
  setTimeout(()=>{ scrim.hidden=true; sheet.hidden=true; sheetIn.textContent=""; },260);
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

function openIngredientSheet(item){
  openSheet(host=>{
    sheetHeader(host, cap(item.item), sectionLabel(sectionFor(item.item))+" · Semana "+(week+1));

    if(item.hint){
      const hb=blockEl("En el menú pone");
      const hp=document.createElement("p");
      hp.style.margin="0"; hp.style.fontSize="13.5px";

      host.appendChild(hb);
    }

    const qb=blockEl("Cantidad a comprar");
    const qr=document.createElement("div");
    qr.className="qtyrow";
    const qi=document.createElement("input");
    qi.className="field"; qi.type="number"; qi.step="any"; qi.min="0"; qi.inputMode="decimal";
    qi.value = item.qty!=null ? fmt(item.qty) : "";
    qi.placeholder="Sin cantidad";
    const ui=document.createElement("input");
    ui.className="field"; ui.type="text"; ui.style.maxWidth="90px";
    ui.value=item.unit||""; ui.placeholder="Unidad";
    function persist(){
      const s=weekState(week);
      const v=qi.value.trim()===""?null:parseFloat(qi.value);
      if(item.custom){
        const c=(s.custom||[]).find(x=>x.key===item.key);
        if(c){ c.qty=isNaN(v)?null:v; c.unit=ui.value.trim()||null; }
      }else{
        s.overrides[item.key]=isNaN(v)?null:v;
      }
      saveWeekState(week,s);
    }
    qi.addEventListener("change",persist);
    ui.addEventListener("change",persist);
    qr.append(qi,ui);
    qb.appendChild(qr);
    if(!item.custom){
      const note=document.createElement("p");
      note.className="hintline";
      note.textContent="Suma de todas las comidas de la semana. Puedes ajustarla.";
      qb.appendChild(note);
    }
    host.appendChild(qb);

    const ob=blockEl(item.custom ? "Añadido por ti"
      : "Aparece en "+item.origins.length+(item.origins.length===1?" comida":" comidas"));
    if(item.custom){
      const p=document.createElement("p");
      p.className="hintline"; p.style.marginTop="0";
      p.textContent="Este producto no viene del menú, lo añadiste tú a la lista de esta semana.";
      ob.appendChild(p);
    }else{
      item.origins.forEach(o=>{
        const r=document.createElement("div");
        r.className="origin";
        const d=document.createElement("span");
        d.className="od"; d.textContent=DAYS[o.day].full;
        const p=document.createElement("span");
        p.className="op";
        const b=document.createElement("b"); b.textContent=o.meal;
        p.append(b,document.createTextNode(o.dish));
        const q=document.createElement("span");
        q.className="oq"; q.textContent=qtyText(o.qty,o.unit)||"—";
        r.append(d,p,q);
        ob.appendChild(r);
      });
    }
    host.appendChild(ob);

    const acts=document.createElement("div");
    acts.className="sheet-actions";
    if(!item.custom){
      const b=document.createElement("button");
      b.className="btn ghost full";
      b.textContent = isBasic(item.item) ? "Quitar de básicos" : "Marcar como básico";
      b.addEventListener("click",()=>{ toggleBasic(item.item); closeSheet(); renderShop(); });
      acts.appendChild(b);
    }
    const del=document.createElement("button");
    del.className="textdanger"; del.textContent="Quitar de la lista";
    del.addEventListener("click",()=>{
      const s=weekState(week);
      const beforeCustom=clone(s.custom||[]);
      const beforeRemoved=clone(s.removed||[]);
      const beforeChecked=clone(s.checked||{});
      if(item.custom) s.custom=(s.custom||[]).filter(x=>x.key!==item.key);
      else if(!s.removed.includes(item.key)) s.removed.push(item.key);
      delete s.checked[item.key];
      saveWeekState(week,s);
      closeSheet(); renderShop();
      showUndo(cap(item.item)+" quitado de la lista", ()=>{
        const s2=weekState(week);
        s2.custom=beforeCustom; s2.removed=beforeRemoved; s2.checked=beforeChecked;
        saveWeekState(week,s2); renderShop();
      });
    });
    acts.appendChild(del);
    host.appendChild(acts);
  });
}

/* --- editor de plato --- */
function openDishSheet(dayIdx,mealIdx,dishIdx){
  openSheet(host=>{

    const dish=meal && meal.dishes[dishIdx];
    if(!dish){ closeSheet(); return; }
    sheetHeader(host,"Editar plato",DAYS[dayIdx].full+" · "+meal.name+" · Semana "+(week+1));

    const nb=blockEl("Nombre del plato");
    const ni=document.createElement("input");
    ni.className="field"; ni.type="text"; ni.value=dish.name;
    ni.addEventListener("input",()=>{ dish.name=ni.value.trim()||"Plato sin nombre"; saveMenu(); });
    nb.appendChild(ni);
    host.appendChild(nb);

    const ib=blockEl("Ingredientes");
    const list=document.createElement("div");
    ib.appendChild(list);
    function drawIngredients(){
      list.textContent="";
      dish.ingredients.forEach((row,idx)=>{
        const c=document.createElement("div");
        c.className="ed-ing";
        const top=document.createElement("div");
        top.className="ed-top";
        const it=document.createElement("input");
        it.className="field"; it.type="text";
        it.value=row.item; it.placeholder="Ingrediente";
        it.addEventListener("input",()=>{ row.item=it.value; saveMenu(); });

        x.className="del-x"; x.setAttribute("aria-label","Quitar ingrediente");
        x.appendChild(svg(P_CLOSE,"2.2"));
        x.addEventListener("click",()=>{
          const removed=clone(row);
          dish.ingredients.splice(idx,1); saveMenu(); drawIngredients();
          showUndo("Ingrediente quitado", ()=>{
            dish.ingredients.splice(idx,0,removed); saveMenu(); drawIngredients(); render();
          });
        });
        top.append(it,x);
        const bot=document.createElement("div");
        bot.className="ed-bot";
        const qt=document.createElement("input");
        qt.className="field"; qt.type="number"; qt.step="any"; qt.min="0"; qt.inputMode="decimal";

        const un=document.createElement("input");
        un.className="field"; un.type="text";
        un.value=row.unit||""; un.placeholder="g, ml, ud";
        un.addEventListener("input",()=>{ row.unit=un.value.trim()||null; saveMenu(); });
        bot.append(qt,un);
        c.append(top,bot);
        list.appendChild(c);
      });
      if(!dish.ingredients.length){
        const p=document.createElement("p");
        p.className="hintline"; p.style.marginTop="0";
        p.textContent="Este plato aún no tiene ingredientes.";
        list.appendChild(p);
      }
    }
    drawIngredients();
    const addI=document.createElement("button");
    addI.className="add-dish"; addI.textContent="+ Añadir ingrediente";
    addI.addEventListener("click",()=>{
      dish.ingredients.push({qty:null,unit:null,item:""});
      saveMenu(); drawIngredients();
      const inputs=list.querySelectorAll('input[type="text"]');
      if(inputs.length>=2) inputs[inputs.length-2].focus();
    });
    ib.appendChild(addI);
    const tip=document.createElement("p");
    tip.className="hintline";
    tip.textContent="Lo que pongas entre paréntesis se muestra como detalle. «(opcional)» deja el producto fuera del total de la compra.";
    ib.appendChild(tip);
    host.appendChild(ib);

    /* preparación previa */
    const pb=blockEl("Preparación previa");
    const pi=document.createElement("input");
    pi.className="field"; pi.type="text";
    pi.placeholder="Sacar el pescado del congelador";
    pi.value=dish.prep||"";
    pi.addEventListener("input",()=>{
      dish.prep=pi.value;
      if(dish.prepWarn===undefined) dish.prepWarn=true;
      saveMenu();
    });
    pb.appendChild(pi);
    const wr=document.createElement("div");
    wr.className="switchrow";
    wr.style.marginTop="10px";
    const wl=document.createElement("span");
    wl.textContent="Avisarme la víspera";
    const wsw=document.createElement("button");
    wsw.className="switch"; wsw.setAttribute("role","switch");
    wsw.setAttribute("aria-label","Avisarme la víspera");
    wsw.innerHTML="<i></i>";
    function paintWarn(){ wsw.setAttribute("aria-checked", dish.prepWarn!==false ? "true":"false"); }
    paintWarn();
    wsw.addEventListener("click",()=>{
      dish.prepWarn = (dish.prepWarn===false);
      saveMenu(); paintWarn();
    });
    wr.append(wl,wsw);
    pb.appendChild(wr);
    const ph=document.createElement("p");
    ph.className="hintline";
    ph.textContent="Aparece en Hoy el día anterior, para que no se te olvide descongelar o poner a remojo.";

    acts.className="sheet-actions";

    del.className="textdanger"; del.textContent="Eliminar este plato";

        meal.dishes.splice(dishIdx,0,removed);

      });

    acts.append(done,del);
    host.appendChild(acts);
  });
}

/* --- buscar --- */
function openSearchSheet(){
  openSheet(host=>{
    sheetHeader(host,"Buscar","Platos e ingredientes de las 4 semanas");
    const inp=document.createElement("input");
    inp.className="field"; inp.type="search";
    inp.placeholder="merluza, croquetas, arroz…";
    inp.setAttribute("aria-label","Buscar");
    host.appendChild(inp);
    const out=document.createElement("div");
    out.style.marginTop="12px";
    host.appendChild(out);

    function run(){
      const q=norm(inp.value.trim());
      out.textContent="";
      if(q.length<2){
        const p=document.createElement("p");
        p.className="hintline";
        p.textContent="Escribe al menos dos letras.";
        out.appendChild(p);
        return;
      }
      const hits=[];
      eachDish((dish,ctx)=>{
        let why=null;
        if(norm(dish.name).indexOf(q)>=0) why="";
        else{
          const m=dish.ingredients.find(i=>norm(parseItem(i.item).short).indexOf(q)>=0);
          if(m) why=cap(parseItem(m.item).short);
        }
        if(why!==null) hits.push({dish,ctx,why});
      });
      const cnt=document.createElement("p");
      cnt.className="hintline"; cnt.style.margin="0 0 8px";
      cnt.textContent = hits.length ? (hits.length===1?"1 plato":hits.length+" platos") : "Nada con «"+inp.value.trim()+"».";
      out.appendChild(cnt);
      if(!hits.length) return;
      const box=document.createElement("div");
      box.className="rows";
      hits.forEach(h=>{
        const b=document.createElement("button");
        b.className="hit";
        const txt=document.createElement("span");
        txt.style.flex="1"; txt.style.minWidth="0";
        const meta=document.createElement("span");
        meta.className="hit-meta";
        meta.textContent="Semana "+(h.ctx.wi+1)+" · "+DAYS[h.ctx.di].full+" · "+h.ctx.meal.name;
        const nm=document.createElement("span");
        nm.className="hit-name"; nm.textContent=h.dish.name;
        txt.append(meta,nm);
        if(h.why){
          const w=document.createElement("span");
          w.className="hit-meta"; w.style.marginTop="3px";
          w.style.textTransform="none"; w.style.letterSpacing="0";
          w.style.fontWeight="400"; w.style.fontSize="11.5px";
          w.textContent="lleva "+h.why.toLowerCase();
          txt.appendChild(w);
        }
        b.appendChild(txt);
        b.appendChild(svg(P_RIGHT,"2.2"));
        b.addEventListener("click",()=>{
          week=h.ctx.wi;
          openDays.add(h.ctx.di);
          renderWeeks();
          setView("semana");
          openDishSheet(h.ctx.di,h.ctx.mi,h.ctx.si);
        });
        box.appendChild(b);
      });
      out.appendChild(box);
    }
    inp.addEventListener("input",run);
    run();
    setTimeout(()=>inp.focus(),300);
  });
}

/* --- compartir --- */
function listAsText(onlyLeft){
  const {st,all}=shopItems(week);
  const hide = lsGet(K_HIDE)==="1";
  let items = hide ? all.filter(i=>!isBasic(i.item)) : all;
  if(onlyLeft) items=items.filter(i=>!st.checked[i.key]);
  const lines=[];
  aisleOrder().forEach(secId=>{
    const part=items.filter(i=>!i.allOptional && sectionFor(i.item)===secId);
    if(!part.length) return;
    lines.push(sectionLabel(secId).toUpperCase());
    part.forEach(i=>{
      const q=qtyText(i.qty,i.unit);
      lines.push("- "+cap(i.item)+(q?" — "+q:""));
    });
    lines.push("");
  });
  const opt=items.filter(i=>i.allOptional);
  if(opt.length){
    lines.push("OPCIONALES");
    opt.forEach(i=>{
      const q=qtyText(i.qty,i.unit);
      lines.push("- "+cap(i.item)+(q?" — "+q:""));
    });
    lines.push("");
  }
  return ("Compra · semana "+(week+1)+"\n\n"+lines.join("\n")).trim();
}

/* --- copia de seguridad --- */
function collectData(){
  const out={app:"menuse",version:1,exported:new Date().toISOString(),data:{}};
  ALL_KEYS.forEach(k=>{ const v=lsGet(k); if(v!=null) out.data[k]=v; });
  if(out.data[K_MENU]==null) out.data[K_MENU]=JSON.stringify(MENU);
  return out;
}
function openDataSheet(){
  openSheet(host=>{
    sheetHeader(host,"Copia de seguridad","Tus datos viven sólo en este navegador");
    const json=JSON.stringify(collectData(),null,2);

    const eb=blockEl("Guardar una copia");
    const ta=document.createElement("textarea");
    ta.className="field"; ta.readOnly=true; ta.value=json;
    const row=document.createElement("div");
    row.className="addrow";
    const copyBtn=document.createElement("button");
    copyBtn.className="btn ghost"; copyBtn.style.flex="1"; copyBtn.textContent="Copiar";
    copyBtn.addEventListener("click",()=>{
      ta.focus(); ta.select();
      let ok=false;
      try{ ok=document.execCommand("copy"); }catch(e){}
      if(!ok && navigator.clipboard){ navigator.clipboard.writeText(json).catch(()=>{}); ok=true; }
      copyBtn.textContent = ok ? "Copiado" : "Selecciona y copia";
      setTimeout(()=>{copyBtn.textContent="Copiar";},2000);
    });
    const dlBtn=document.createElement("button");
    dlBtn.className="btn"; dlBtn.style.flex="1"; dlBtn.textContent="Descargar";
    dlBtn.addEventListener("click",()=>{
      try{
        const blob=new Blob([json],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="menuse-"+new Date().toISOString().slice(0,10)+".json";
        document.body.appendChild(a); a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
      }catch(e){
        dlBtn.textContent="Usa Copiar";
        setTimeout(()=>{dlBtn.textContent="Descargar";},2500);
      }
    });
    row.append(copyBtn,dlBtn);
    const note=document.createElement("p");
    note.className="hintline";
    note.textContent="Guarda el archivo en Drive o mándatelo por correo. Si borras los datos de Chrome o cambias de móvil, es lo único que recupera tu menú.";
    eb.append(ta,row,note);
    host.appendChild(eb);

    const ibx=blockEl("Restaurar una copia");
    const file=document.createElement("input");
    file.className="field"; file.type="file"; file.accept="application/json,.json";
    const ta2=document.createElement("textarea");
    ta2.className="field"; ta2.style.marginTop="8px";
    ta2.placeholder="…o pega aquí el contenido del archivo";
    const impBtn=document.createElement("button");
    impBtn.className="btn full"; impBtn.style.marginTop="8px";
    impBtn.textContent="Restaurar";
    const msg=document.createElement("p");
    msg.className="hintline";
    function apply(text){
      let obj;
      try{ obj=JSON.parse(text); }
      catch(e){ msg.textContent="Ese texto no es una copia válida de Menuse."; msg.style.color="var(--danger)"; return; }
      if(!obj || (obj.app!=="menuse" && obj.app!=="vianda") || !obj.data){
        msg.textContent="Ese archivo no es una copia de Menuse.";
        msg.style.color="var(--danger)"; return;
      }
      Object.keys(obj.data).forEach(k=>{ if(ALL_KEYS.indexOf(k)>=0) lsSet(k,obj.data[k]); });
      msg.style.color="var(--ink-faint)";
      msg.textContent="Restaurado. Recargando…";
      setTimeout(()=>{ location.reload(); },700);
    }
    file.addEventListener("change",()=>{
      const f=file.files && file.files[0];
      if(!f) return;
      const r=new FileReader();
      r.onload=()=>apply(String(r.result||""));
      r.readAsText(f);
    });
    impBtn.addEventListener("click",()=>{
      const t=ta2.value.trim();
      if(!t){ msg.textContent="Elige un archivo o pega el contenido."; msg.style.color="var(--danger)"; return; }
      apply(t);
    });
    ibx.append(file,ta2,impBtn,msg);
    host.appendChild(ibx);

    const acts=document.createElement("div");
    acts.className="sheet-actions";
    const restore=document.createElement("button");
    restore.className="textdanger";
    restore.textContent="Volver al menú original";
    restore.addEventListener("click",()=>{
      const before=lsGet(K_MENU);
      MENU=migrate(clone(DEFAULT_MENU));
      saveMenu(); closeSheet(); render();
      showUndo("Menú original restablecido", ()=>{
        if(before!=null){ lsSet(K_MENU,before); }
        try{ MENU=migrate(JSON.parse(lsGet(K_MENU))); }catch(e){}
        render();
      });
    });
    acts.appendChild(restore);
    host.appendChild(acts);
  });
}

/* ---------- navegación ---------- */
function renderWeeks(){
  const seg=document.getElementById("weekSeg");
  seg.textContent="";
  for(let w=0;w<4;w++){
    const b=document.createElement("button");
    b.textContent=String(w+1);
    b.setAttribute("aria-pressed", w===week?"true":"false");
    b.setAttribute("aria-label","Semana "+(w+1));
    b.addEventListener("click",()=>{ week=w; renderWeeks(); render(); });
    seg.appendChild(b);
  }
}
function render(){
  const tag=document.getElementById("tagline");
  if(view==="hoy") tag.textContent=DAYS[todayIdx].full+" · Semana "+(week+1);
  else if(view==="semana") tag.textContent="Semana "+(week+1)+" · 7 días";
  else tag.textContent="Lista de la compra · semana "+(week+1);
  if(view==="hoy") renderHoy();
  else if(view==="semana") renderSemana();
  else renderShop();
}
function setView(v){
  view=v;
  document.getElementById("viewHoy").hidden = v!=="hoy";
  document.getElementById("viewSemana").hidden = v!=="semana";
  document.getElementById("viewShop").hidden = v!=="shop";
  document.getElementById("tabHoy").setAttribute("aria-selected", v==="hoy"?"true":"false");
  document.getElementById("tabSemana").setAttribute("aria-selected", v==="semana"?"true":"false");
  document.getElementById("tabShop").setAttribute("aria-selected", v==="shop"?"true":"false");
  render();
  window.scrollTo(0,0);
}
document.getElementById("tabHoy").addEventListener("click",()=>setView("hoy"));
document.getElementById("tabSemana").addEventListener("click",()=>setView("semana"));
document.getElementById("tabShop").addEventListener("click",()=>setView("shop"));
document.getElementById("dataBtn").addEventListener("click",openDataSheet);

const themeBtn=document.getElementById("themeBtn");
(function initTheme(){
  const saved=lsGet(K_THEME);
  if(saved==="dark"||saved==="light") document.documentElement.setAttribute("data-theme",saved);
})();
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const prefersDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur==="dark" : prefersDark;
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  lsSet(K_THEME,next);
});

window.addEventListener("online", ()=>{ if(view==="shop") renderShop(); });
window.addEventListener("offline",()=>{ if(view==="shop") renderShop(); });

/* sin conexión */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

renderWeeks();
setView("hoy");
</script>
