<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menuse</title>
<meta name="description" content="Qué comer cada día y la compra de la semana">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menuse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="wordmark" aria-label="Menuse">menuse<span>.</span></div>
    <!-- qué semana estás mirando; al tocarlo se elige otra -->
    <button class="weekpill" id="weekPill" aria-label="Elegir semana"></button>
    <!-- ajustes: estaciones, tema y copia de seguridad -->
    <button class="hbtn" id="settingsBtn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
      </svg>
    </button>
  </div>
</header>

<main class="shell">
  <!-- aviso fijo cuando miras el menú de otra estación -->
  <div id="banner"></div>
  <section class="view" id="viewHoy"></section>
  <section class="view" id="viewSemana" hidden></section>
  <section class="view" id="viewShop" hidden></section>
</main>

<!-- barra de pestañas flotante, abajo, al alcance del pulgar -->
<nav class="tabbar" role="tablist" aria-label="Secciones">
  <div class="tabbar-in">
    <button class="tab" id="tabHoy" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>
      </svg>
      Hoy
    </button>
    <button class="tab" id="tabSemana" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/>
      </svg>
      Semana
    </button>
    <button class="tab" id="tabShop" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 9a4 4 0 0 1 8 0"/><path d="M3.8 9h16.4l-2 10.2a2 2 0 0 1-2 1.6H7.8a2 2 0 0 1-2-1.6z"/>
      </svg>
      Compra
    </button>
  </div>
</nav>

<div class="snack" id="snack" hidden>
  <span id="snackMsg"></span>
  <button id="snackUndo">Deshacer</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden tabindex="-1">
  <div class="grab"></div>
  <div class="sheet-in" id="sheetIn"></div>
</div>

<!-- Toda la lógica está en js/ (Model, ViewModel y View). Empieza por js/app.js -->
<script type="module" src="js/app.js"></script>
</body>
</html>
